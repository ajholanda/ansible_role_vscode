---
- name: Include tasks for {{ ansible_facts['pkg_mgr'] | default('Linux') }}
  ansible.builtin.include_tasks: "{{ ansible_facts['pkg_mgr'] }}.yml"
  when:
    - ansible_facts['pkg_mgr'] is defined
    - ansible_facts['pkg_mgr'] in ["apt", "dnf", "zypper"]
  tags: vscode

- name: Install VS Code on Windows
  chocolatey.chocolatey.win_chocolatey:
    name: vscode
    state: "{{ vscode_state }}"
  when: ansible_facts['system'] | lower == "win32nt"
  tags: vscode, win_chocolatey
