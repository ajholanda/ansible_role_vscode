---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python on Debian and Ubuntu
      ansible.builtin.raw: >
        command -v python3
        || ! command -v apt-get
        || (apt-get update && apt-get install -y python3)
      changed_when: false

    # openSUSE images ship without Python; python313-rpm is needed by package_facts
    - name: Install Python on openSUSE
      ansible.builtin.raw: >
        ! command -v zypper
        || zypper --non-interactive install python3 python313-rpm
      changed_when: false
