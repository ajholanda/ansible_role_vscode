---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: docker
platforms:
  - name: debian
    image: docker.io/library/debian:bookworm
    pre_build_image: true
    command: sleep infinity
  - name: ubuntu
    image: docker.io/library/ubuntu:24.04
    pre_build_image: true
    command: sleep infinity
  # RHEL 9 rebuild: UBI images lack xdg-utils, required by the code package
  - name: redhat
    image: docker.io/library/almalinux:9
    pre_build_image: true
    command: sleep infinity
  - name: suse
    image: docker.io/opensuse/leap:16.0
    pre_build_image: true
    command: sleep infinity
provisioner:
  name: ansible
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
